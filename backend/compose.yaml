services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tour_guard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tour_guard"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgis_data:
